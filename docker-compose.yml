# Lancement en une seule commande : docker compose up
services:
  api:
    build: .
    image: medialens-classifier:latest
    container_name: medialens-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
